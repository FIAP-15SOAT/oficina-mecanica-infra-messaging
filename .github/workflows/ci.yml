name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  tf-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Terraform Init Infra AWS
        run: terraform init -backend=false -no-color
        working-directory: terraform
      - name: Terraform Validate Infra AWS
        run: terraform validate -no-color
        working-directory: terraform
      - name: Configure AWS Credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Plan Infra AWS
        if: steps.aws_creds.outcome == 'success'
        working-directory: terraform
        run: |
          terraform init -reconfigure -no-color -backend-config="bucket=$TF_STATE_BUCKET"
          terraform plan -no-color
      - name: Note skipped plan in job summary
        if: steps.aws_creds.outcome == 'failure'
        run: |
          {
            echo '### Terraform plan — skipped ⏭️'
            echo ''
            echo 'The target environment appears to be unavailable, so `terraform plan` was skipped. **This does not block CI** — `fmt` and `validate` passed. Re-run once the environment is back up to preview the plan.'
          } >> "$GITHUB_STEP_SUMMARY"

  routing-tests:
    name: Routing Tests
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
      - name: Start LocalStack with the init script
        run: docker compose up -d
      - name: Routing tests
        run: pytest tests -v
      - name: Dump LocalStack logs on failure
        if: failure()
        run: docker compose logs localstack

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - tf-validate
      - routing-tests
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@21cfef2b496dd8ef5b904c159339626a10ad380e # v1.11.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Open a PR to main if none exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base main --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "An open PR already exists for ${HEAD_BRANCH} -> main; nothing to do."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "Automated PR opened by CI on behalf of @${ACTOR} after all checks passed on \`${HEAD_BRANCH}\`."
